name: Mirror to HuggingFace

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd /tmp
          git clone https://i-Lang:${HF_TOKEN}@huggingface.co/datasets/i-Lang/iLang-Spec hf-repo
          cd /tmp/hf-repo
          rm -f SPEC-v5.0-PATCH-1.md SPEC-v5.0-PATCH-2.md SPEC-v5.0-PRE.md
          cp $GITHUB_WORKSPACE/SPEC.md .
          cp $GITHUB_WORKSPACE/SPEC-v4.0-FINAL.md .
          cp $GITHUB_WORKSPACE/SPEC-v5.0.md .
          cp $GITHUB_WORKSPACE/SPEC-v4.1-MEDIA-PROFILE.md .
          cp $GITHUB_WORKSPACE/SPEC-v4.2-MEDIA-REGIONS-AND-LAYERS.md .
          mkdir -p archive && cp $GITHUB_WORKSPACE/archive/*.md archive/
          cp $GITHUB_WORKSPACE/AUTHORS.md .
          cp $GITHUB_WORKSPACE/README.md .
          cp $GITHUB_WORKSPACE/LICENSE .
          cp $GITHUB_WORKSPACE/ilang_judge_validator.py .
          cp $GITHUB_WORKSPACE/ilang_grammar_validator.py .
          mkdir -p schema && cp $GITHUB_WORKSPACE/schema/*.json $GITHUB_WORKSPACE/schema/*.py schema/
          # README.md links runtime/ilang-latest.md, runtime/ and products/. The bundles, their sha256
          # files and the manifest are the runtime a reader can paste; products/ goes without its two
          # PNG files, since the Hub refuses binary files that are not stored through LFS or Xet.
          mkdir -p runtime && cp $GITHUB_WORKSPACE/runtime/*.md $GITHUB_WORKSPACE/runtime/*.sha256 $GITHUB_WORKSPACE/runtime/manifest.json runtime/
          cp -r $GITHUB_WORKSPACE/products . && find products -name '*.png' -delete
          git config user.name "ilang-ai"
          git config user.email "ilang-ai@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Sync from GitHub"
          git push origin main
