# Push to main with a new version in CITATION.cff and this tags it and publishes
# the release; the Zenodo webhook on this repository then archives that release
# and mints its DOI. Nothing runs when the version is unchanged, so an ordinary
# commit never creates a release.
#
# Pre-release lines (tags such as v5.0-pre.x) stay manual: CITATION.cff carries
# the stable version, and this workflow only ever tags that one.

name: Release on version change

on:
  push:
    branches: [main]
    paths: ['CITATION.cff']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version from CITATION.cff
        id: read
        run: |
          version=$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}.*/\1/p' CITATION.cff | head -1)
          if [ -z "$version" ]; then
            echo "CITATION.cff has no version field" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "v$version already exists; nothing to do"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      # The release carries the runtime bundles, and runtime.yml rebuilds them in a
      # commit of its own after a canon file changes. When the content and the new
      # version reach main in one push, the bundles at this commit are still those
      # of the previous release (v5.0.7, v5.0.13 and v5.0.15 were tagged that way).
      # No tag unless each sha256 in a bundle's Contents list is that of the file.
      - name: Check that the runtime bundles were built from the sources at this commit
        if: steps.read.outputs.tagged == 'false'
        run: |
          for bundle in runtime/ilang-full.md runtime/ilang-media-latest.md; do
            if ! sed -n -e '/^===== BEGIN /q' -e 's/^[0-9][0-9]*\. \([^:]*\): .* sha256:\([0-9a-f]\{64\}\)$/\2  \1/p' "$bundle" | sha256sum -c -; then
              echo "$bundle was not built from the sources at this commit." >&2
              echo "Wait for the \"runtime: rebuild bundles\" commit on main, then run this workflow again by workflow_dispatch." >&2
              exit 1
            fi
          done

      - name: Tag and publish the release
        if: steps.read.outputs.tagged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "$REPO_NAME $VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --latest --generate-notes --title "$REPO_NAME $VERSION"
          echo "released v$VERSION; Zenodo archives it from the release webhook" >> "$GITHUB_STEP_SUMMARY"
