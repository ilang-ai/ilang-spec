name: Canon Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Grammar validator selftest
        run: python ilang_grammar_validator.py --selftest
      - name: Canon gate (grammar + registry)
        run: python ilang_grammar_validator.py --canon .
      - name: Judge validator selftest
        run: python ilang_judge_validator.py --selftest
      - name: JUDGE blocks in spec
        run: |
          python ilang_judge_validator.py --check SPEC-v5.0-PRE.md
      - name: JSON Schemas (non-normative) against examples and the reference validator
        run: python schema/check_schemas.py
      - name: Symbol audit selftest
        run: python symbol_audit.py --selftest
      # Seal condition S3 (every symbol of the normative text has a home). Advisory until the
      # v5.0 seal; the seal commit removes continue-on-error.
      - name: Symbol audit of SPEC-v5.0-PRE.md (seal condition S3)
        run: python symbol_audit.py SPEC-v5.0-PRE.md
        continue-on-error: true
