name: Canon Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Grammar validator selftest
        run: python ilang_grammar_validator.py --selftest
      - name: Canon gate (grammar + registry)
        run: python ilang_grammar_validator.py --canon .
      - name: Judge validator selftest
        run: python ilang_judge_validator.py --selftest
      - name: JUDGE blocks in spec
        run: |
          python ilang_judge_validator.py --check SPEC-v5.0.md
      # products/media-chain/ACCEPTANCE.ilang.md C8 and C9 name these two commands, with the exit
      # code and the counts each must print; a change to the judge validator or to a demo file that
      # breaks either item fails here.
      - name: Media Chain acceptance C8 (the demo series' JUDGE blocks are valid and consistent)
        run: |
          rc=0; out=$(python ilang_judge_validator.py --check products/media-chain/demo/SERIES-001.ilang.md) || rc=$?
          echo "$out"
          [ "$rc" -eq 0 ] && echo "$out" | grep -q "schema_fail=0 mode_mismatch=0"
      - name: Media Chain acceptance C9 (the six defective JUDGE blocks of BAD-001 are all refused)
        run: |
          rc=0; out=$(python ilang_judge_validator.py --check products/media-chain/demo/BAD-001.ilang.md) || rc=$?
          echo "$out"
          [ "$rc" -eq 1 ] && echo "$out" | grep -q "schema_fail=5 mode_mismatch=1"
      - name: JSON Schemas (non-normative) against examples and the reference validator
        run: python schema/check_schemas.py
      - name: Symbol audit selftest
        run: python symbol_audit.py --selftest
      # Seal condition S3: every symbol of the normative text has a home. Blocking since the
      # v5.0 seal (v5.0-pre-2.4.1-sealed, 2026-09-26).
      - name: Symbol audit of SPEC-v5.0.md (seal condition S3)
        run: python symbol_audit.py SPEC-v5.0.md
      # Products (MODULE::PRODUCT): every product document lints clean in strict mode, and the IML form
      # shipped beside it is what the reference codec produces, byte for byte.
      - name: References register (Appendix H) is the source of the release metadata
        run: python tools/references.py check
      - name: Products lint (strict)
        run: python ilang_grammar_validator.py --lint $(find products -name '*.ilang.md') --strict
      - name: Products IML round trip
        run: for d in products/*/; do python products/check_product.py --dir "$d" --iml || exit 1; done
